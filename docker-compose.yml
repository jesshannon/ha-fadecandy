services:
  ha-fadecandy:
    build:
      context: ./fadecandy-node
      args:
        BUILD_FROM: ghcr.io/home-assistant/aarch64-base-python:latest
    environment:
      - SUPERVISOR_TOKEN=${DEV_TOKEN}
      - API_URL=${API_URL}
      - SOCKET_URL=${SOCKET_URL}
    ports:
      - "7890:7890"
    volumes:
      - ./fadecandy-node/src/:/usr/src/app/src/