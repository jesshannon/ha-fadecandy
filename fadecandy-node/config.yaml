name: "Fadecandy Node Controller"
version: "0.1.18"
slug: "fadecandy_node"
description: "Runs a Node.js service that connects to a Fadecandy LED controller over USB on HAOS."
url: "https://example.com/fadecandy-node-addon"
arch:
  - aarch64
  - armv7
  - armhf
  - amd64
  - i386
startup: services
boot: auto
init: false
usb: true
privileged:
  - SYS_RAWIO
  - SYS_ADMIN
devices:
  - "/dev/bus/usb:/dev/bus/usb:rwm"
map:
  - config:rw
environment:
  NODE_ENV: production
options:
  log_level: info
schema:
  log_level: list(debug|info|warn|error)
ports:
  7890/tcp: null
ports_description:
  7890/tcp: Test
