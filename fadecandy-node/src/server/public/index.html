<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>FadeCandy Bookshelf Lab</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="background-accent"></div>
  <header>
    <div>
      <h1>LED Bookshelf</h1>
    </div>
    <div class="pill ready" id="status-pill">Ready?</div>
  </header>

  <section class="panel">
    <div class="controls">
      <div>
        <label class="label">Mode</label>
        <div class="control-row">
          <select id="mode-select"></select>
          <button id="run-mode">Run</button>
          <button id="stop-mode" class="ghost">Stop</button>
        </div>
      </div>
      <div class="control-row">
        <button id="all-off" class="ghost">All Off</button>
        <button id="refresh-state" class="ghost">Refresh</button>
      </div>
    </div>
  </section>

  <section class="panel shelves">
    <div class="panel-head">
      <p class="label">Bookshelf simulator</p>
      <p class="subtle" id="last-sync">Syncing…</p>
    </div>
    <div class="canvas-wrap">
      <canvas id="shelf-canvas"></canvas>
    </div>
    <div id="shelf-grid" class="shelf-grid"></div>
  </section>

  <section class="panel painter-panel">
    <div class="panel-head">
      <p class="label">Paint shelves</p>
      <p class="subtle">Choose a color, and paint</p>
    </div>
    <div class="paint-controls">
      <div class="current-color">
        <div id="brush-preview" aria-hidden="true"></div>
      </div>
      <div id="recent-colors">
        <div class="recent-colour" aria-hidden="true"></div>
      </div>
      <input type="color" id="color-picker" value="#46c2a6" aria-label="Select paint color" />
    </div>
  </section>

  <div id="toast" class="toast hidden"></div>

  <script src="app.js"></script>
</body>
</html>
